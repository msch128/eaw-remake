[package]
name = "alamo-render"
description = "Bevy plugin that spawns original Empire at War models (.alo) with an EaW-style look."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "default_app", "std", "multi_threaded", "bevy_window",
    "3d_bevy_render",
] }
alamo-fs = { path = "../alamo-fs" }
alamo-model = { path = "../alamo-model" }
