[package]
name = "battle-view"
description = "Bevy plugin that renders and drives a battle-sim space battle with the Empire at War look and controls."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Chrome trace output for profiling (TRACE_CHROME=1).
profile = ["bevy/trace_chrome"]

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "default_app", "std", "multi_threaded", "bevy_winit", "bevy_window", "default_font", "x11",
    "3d_bevy_render",
] }
alamo-fs = { path = "../alamo-fs" }
alamo-data = { path = "../alamo-data" }
alamo-map = { path = "../alamo-map" }
alamo-model = { path = "../alamo-model" }
alamo-render = { path = "../alamo-render" }
battle-sim = { path = "../battle-sim" }
galaxy-sim = { path = "../galaxy-sim" }
alamo-audio = { path = "../alamo-audio" }
eaw-ui = { path = "../eaw-ui" }

