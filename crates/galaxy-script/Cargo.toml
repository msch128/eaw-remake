[package]
name = "galaxy-script"
description = "Runs Empire at War Lua story/scoring scripts against galaxy-sim: a ScriptHost implementation and a combined stepper."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alamo-fs = { path = "../alamo-fs" }
alamo-data = { path = "../alamo-data" }
alamo-lua = { path = "../alamo-lua" }
galaxy-ai = { path = "../galaxy-ai" }
galaxy-sim = { path = "../galaxy-sim" }
