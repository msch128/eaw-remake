[package]
name = "alamo-lua"
description = "Lua 5.0-style script runtime for Empire at War scripts: loader, cooperative threads, engine API bindings via a host trait."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alamo-fs = { path = "../alamo-fs" }
alamo-data = { path = "../alamo-data" }
mlua = { version = "0.11", features = ["lua51", "vendored"] }

