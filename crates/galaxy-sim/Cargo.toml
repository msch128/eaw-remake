[package]
name = "galaxy-sim"
description = "Headless deterministic galactic conquest simulation (space only) for Empire at War: Forces of Corruption data."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
alamo-data = { path = "../alamo-data" }
battle-sim = { path = "../battle-sim" }

[dev-dependencies]
alamo-fs = { path = "../alamo-fs" }
serde_json = { version = "1", features = ["float_roundtrip"] }
