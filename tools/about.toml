# cargo about: licence texts of every crate in the shipped program. tools/package.ps1 writes them, with the licence of
# Bevy's embedded default font (tools/licenses/FiraMono-OFL-1.1.txt), into THIRD-PARTY-LICENSES.html inside the setup.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "OFL-1.1",
    "NCSA",
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
