[workspace]
resolver = "3"
members = [
    "crates/alamo-fs",
    "crates/alamo-map",
    "crates/alamo-lua",
    "crates/galaxy-script",
    "crates/galaxy-ai",
    "crates/alamo-audio",
    "crates/alamo-data",
    "crates/galaxy-sim",
    "crates/battle-sim",
    "crates/alamo-model",
    "crates/alamo-render",
    "crates/battle-view",
    "crates/space-peace",
    "crates/galaxy-play",
    "crates/eaw-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/msch128/eaw-remake"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1










